<style>
:root{--bg:#f7f6f2;--card:#fff;--text:#10222a;--muted:#68777d;--green:#0d6657;--soft:#dff1eb;--red:#bb3a2f;--redsoft:#fde7e3;--amber:#b86116;--ambersoft:#fff0df;--line:#e1e7e4;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:var(--bg)}*{box-sizing:border-box}html,body{margin:0;background:var(--bg)}button,input,select,textarea{font:inherit}.app{max-width:760px;margin:auto;min-height:100vh}.top{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#f7f6f2ee;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.brand{display:flex;align-items:center;gap:10px}.brand img{width:40px;height:40px}.brand b{font-size:21px}.brand small{display:block;color:var(--muted)}.install{border:0;border-radius:12px;background:#fff;padding:10px;display:none}.main{padding:18px 16px 92px}.view{display:none}.view.active{display:block}.title{margin:0;font-size:25px}.muted{color:var(--muted)}.small{font-size:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}.hero{background:linear-gradient(145deg,#eff8f4,#fff)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.start{align-items:flex-start}.amount{font-size:34px;font-weight:850}.badge{display:inline-flex;padding:6px 9px;border-radius:999px;font-size:12px;font-weight:750}.ok{background:#e0f5eb;color:#18865f}.pending{background:var(--redsoft);color:var(--red)}.info{background:var(--soft);color:var(--green)}.warn{background:var(--ambersoft);color:var(--amber)}.switch{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin:16px 0}.switch button{border:0;background:#fff;border-radius:12px;height:40px;font-size:22px}.switch b{text-align:center}.pay{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center}.ico{width:44px;height:44px;border-radius:14px;background:#f1f4f2;display:grid;place-items:center;font-size:21px}.btn{border:0;border-radius:13px;padding:11px 14px;font-weight:750}.primary{background:var(--green);color:#fff}.secondary{background:#f1f4f2;color:var(--text);border:1px solid var(--line)}.danger{background:var(--redsoft);color:var(--red)}.full{width:100%}.compact{padding:7px 9px}.alert{padding:14px;border-radius:15px;margin-bottom:14px}.alert.info{background:var(--soft)}.alert.warn{background:var(--ambersoft)}.progress{height:8px;background:#e8ecea;border-radius:99px;overflow:hidden;margin-top:12px}.progress i{display:block;height:100%;background:var(--green)}.list{padding:0;overflow:hidden}.listrow{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}.listrow:last-child{border-bottom:0}.dot{width:30px;height:30px;border-radius:50%;background:#f1f4f2;display:grid;place-items:center}.dot.ok{background:#e0f5eb}.kv{display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.kv:last-child{border-bottom:0}.kv b{text-align:right}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:12px}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;white-space:nowrap}.tab.active{background:var(--green);color:#fff}.upload{border:1.5px dashed #a9c8bf;border-radius:16px;padding:20px;text-align:center;background:#f7fbf9;width:100%;margin-bottom:14px}.doc{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.doc:last-child{border-bottom:0}.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(760px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);padding:7px}.nav{border:0;background:transparent;color:var(--muted);padding:8px 2px;border-radius:12px}.nav span{display:block;font-size:21px}.nav small{font-size:11px}.nav.active{background:var(--soft);color:var(--green);font-weight:700}.modalbg{position:fixed;inset:0;background:#08181670;z-index:50;display:flex;align-items:flex-end;justify-content:center}.modal{width:min(760px,100%);max-height:92vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:18px 16px 25px}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:12px;color:var(--muted);font-weight:700}.input{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.close{border:0;background:transparent;font-size:24px}.toast{position:fixed;z-index:80;left:50%;bottom:90px;transform:translateX(-50%);background:#10222a;color:#fff;padding:11px 16px;border-radius:99px;display:none}.about{text-align:center}.about img{width:min(100%,430px)}@media(max-width:480px){.grid{grid-template-columns:1fr}}
</style>

<body>
<div class="app"><header class="top"><div class="brand"><img src="assets/icon.svg" alt=""><div><b>RenT</b><small>Rent tracker</small></div></div><button id="install" class="install">⬇️ Instalar</button></header><main class="main"><section id="home" class="view active"></section><section id="history" class="view"></section><section id="contract" class="view"></section><section id="documents" class="view"></section><section id="more" class="view"></section></main><nav class="bottom"><button class="nav active" data-view="home"><span>⌂</span><small>Inicio</small></button><button class="nav" data-view="history"><span>▥</span><small>Historial</small></button><button class="nav" data-view="contract"><span>▤</span><small>Contrato</small></button><button class="nav" data-view="documents"><span>▱</span><small>Documentos</small></button><button class="nav" data-view="more"><span>•••</span><small>Más</small></button></nav></div><div id="modal"></div><div id="toast" class="toast"></div>
<script>
const KEY='rent-state-v1',MONTHS=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'],TYPES=[['rent','Renta','🏠'],['maintenance','Mantto','🧾'],['club','Casa Club','🏡']],CATS={contract:'Contrato',receipt:'Comprobante',identification:'Identificación',other:'Otro'};
const seed=()=>({selectedMonth:'2026-09',settings:{propertyName:'Mi departamento',propertyLocation:'',currency:'MXN',rentAmount:0,maintenanceAmount:1800,clubAmount:800,rentDueDay:5,serviceDueDay:5,tenantName:'Nuevo inquilino',tenantEmail:'',tenantPhone:'',contractStart:'2026-09-01',contractEnd:'2027-08-31',depositAmount:0,depositPaid:false,depositDate:'',adminFeeAmount:0,adminFeePaid:false,adminFeeDate:'',adminFeeNote:'Cuota pendiente por nuevo inquilino'},payments:[],notes:{'2026-08':'Inquilino anterior salió','2026-09':'Nuevo inquilino'},legacy:['2025-04','2025-05','2025-06','2025-07','2025-08','2025-09','2025-10','2025-11','2025-12','2026-01','2026-02','2026-03','2026-04','2026-05','2026-06','2026-07']});
let state=(()=>{try{let p=JSON.parse(localStorage.getItem(KEY));if(!p)return seed();let s=seed();return {...s,...p,settings:{...s.settings,...p.settings}}}catch{return seed()}})(),histYear=2026,docFilter='all',deferredPrompt;
const save=()=>localStorage.setItem(KEY,JSON.stringify(state)),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0}).format(Number(n||0)),fmt=v=>v?new Intl.DateTimeFormat('es-MX',{day:'numeric',month:'short',year:'numeric'}).format(new Date(v+'T12:00:00')):'—';
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2000)}
function monthLabel(k){let[y,m]=k.split('-').map(Number);return MONTHS[m-1]+' '+y}function shift(k,d){let[y,m]=k.split('-').map(Number);m+=d;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return y+'-'+String(m).padStart(2,'0')}function amount(t){let s=state.settings;return Number(t==='rent'?s.rentAmount:t==='maintenance'?s.maintenanceAmount:s.clubAmount)||0}function pay(k,t){return state.payments.find(p=>p.month===k&&p.type===t)}function status(k,t){if(pay(k,t))return'paid';if(t==='rent'&&state.legacy.includes(k))return'legacy';if(!amount(t))return'unconfigured';return'pending'}function pendingTotal(k){return TYPES.reduce((a,[t])=>a+(status(k,t)==='pending'?amount(t):0),0)}function done(k){return TYPES.filter(([t])=>['paid','legacy'].includes(status(k,t))).length}
function modal(title,html){document.getElementById('modal').innerHTML=`<div class="modalbg" id="mbg"><div class="modal"><div class="row"><h2>${esc(title)}</h2><button class="close" id="mclose">×</button></div>${html}</div></div>`;document.getElementById('mclose').onclick=closeModal;document.getElementById('mbg').onclick=e=>{if(e.target.id==='mbg')closeModal()}}function closeModal(){document.getElementById('modal').innerHTML=''}
function navigate(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(v).classList.add('active');document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.view===v));render(v);scrollTo(0,0)}function render(v){if(v==='home')home();if(v==='history')history();if(v==='contract')contract();if(v==='documents')documents();if(v==='more')more()}
function home(){let k=state.selectedMonth,s=state.settings,c=done(k),p=pendingTotal(k);document.getElementById('home').innerHTML=`<div class="row start"><div><h1 class="title">${esc(s.propertyName)}</h1><div class="muted">${esc(s.propertyLocation||'Tu propiedad')}</div></div><span class="badge info">${esc(s.tenantName)}</span></div><div class="switch"><button id="prev">‹</button><b>${monthLabel(k)}</b><button id="next">›</button></div>${!s.rentAmount?'<div class="alert info"><b>ℹ️ Configura el monto de la renta</b><div class="small">Mantto $1,800 y Casa Club $800 ya están listos.</div></div>':''}<div class="card hero"><div class="row"><div><div class="small muted">Pendiente total</div><div class="amount">${money(p)}</div></div><span class="badge ${c===3?'ok':'info'}">${c} de 3 pagados</span></div><div class="progress"><i style="width:${c/3*100}%"></i></div></div>${s.adminFeeAmount&&!s.adminFeePaid?`<div class="alert warn" id="admin"><b>⚠️ Cuota administrativa pendiente</b><div>${money(s.adminFeeAmount)} · ${esc(s.adminFeeNote)}</div></div>`:''}<h3>Pagos del mes</h3>${TYPES.map(([t,l,i])=>payCard(k,t,l,i)).join('')}`;document.getElementById('prev').onclick=()=>{state.selectedMonth=shift(k,-1);save();home()};document.getElementById('next').onclick=()=>{state.selectedMonth=shift(k,1);save();home()};document.getElementById('admin')?.addEventListener('click',()=>navigate('contract'));document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>payModal(k,b.dataset.pay))}
function payCard(k,t,l,i){let st=status(k,t),p=pay(k,t),meta=st==='paid'?`Pagado ${fmt(p.date)} · ${esc(p.method||'')}`:st==='legacy'?'Registro histórico importado':st==='unconfigured'?'Monto sin configurar':`Vence ${fmt(k+'-'+String(t==='rent'?state.settings.rentDueDay:state.settings.serviceDueDay).padStart(2,'0'))}`;let b=st==='paid'?'<span class="badge ok">✓ Pagado</span>':st==='legacy'?'<span class="badge ok">✓ Pagado*</span>':st==='unconfigured'?'<span class="badge warn">Configurar</span>':'<span class="badge pending">Pendiente</span>';return `<div class="card pay"><div class="ico">${i}</div><div><b>${l}</b><div><b>${amount(t)?money(amount(t)):'—'}</b></div><div class="small muted">${meta}</div></div><div>${b}<div style="text-align:right;margin-top:7px"><button class="btn secondary compact" data-pay="${t}">${st==='paid'?'Editar':'Registrar'}</button></div></div></div>`}
function payModal(k,t){let e=pay(k,t),a=e?.amount??amount(t);modal('Registrar pago',`<form id="pf"><div class="field"><label>Concepto</label><select id="pt" class="input">${TYPES.map(([x,l])=>`<option value="${x}" ${x===t?'selected':''}>${l}</option>`).join('')}</select></div><div class="grid"><div class="field"><label>Monto MXN</label><input id="pa" class="input" type="number" min="0" value="${a||''}" required></div><div class="field"><label>Fecha</label><input id="pd" class="input" type="date" value="${e?.date||new Date().toISOString().slice(0,10)}" required></div></div><div class="field"><label>Método</label><select id="pm" class="input"><option>Transferencia bancaria</option><option>Efectivo</option><option>Otro</option></select></div><div class="field"><label>Nota</label><textarea id="pn" class="input">${esc(e?.note||'')}</textarea></div><button class="btn primary full">Guardar</button>${e?'<button type="button" id="pdel" class="btn danger full" style="margin-top:8px">Eliminar pago</button>':''}</form>`);if(e)document.getElementById('pm').value=e.method||'Transferencia bancaria';document.getElementById('pf').onsubmit=x=>{x.preventDefault();let nt=document.getElementById('pt').value;state.payments=state.payments.filter(p=>!(p.month===k&&p.type===t));state.payments=state.payments.filter(p=>!(p.month===k&&p.type===nt));state.payments.push({month:k,type:nt,amount:Number(document.getElementById('pa').value),date:document.getElementById('pd').value,method:document.getElementById('pm').value,note:document.getElementById('pn').value});save();closeModal();home();toast('Pago guardado')};document.getElementById('pdel')?.addEventListener('click',()=>{state.payments=state.payments.filter(p=>!(p.month===k&&p.type===t));save();closeModal();home();toast('Pago eliminado')})}
function history(){let rows=MONTHS.map((m,i)=>{let k=histYear+'-'+String(i+1).padStart(2,'0'),c=done(k),p=pendingTotal(k),n=state.notes[k];return `<div class="listrow"><div class="dot ${c===3?'ok':''}">${c===3?'✓':c||'○'}</div><div><b>${m}</b><div class="small muted">${esc(n||c+' de 3 pagos')}</div></div><b>${p?money(p):c?'Completo':'—'}</b></div>`}).join('');document.getElementById('history').innerHTML=`<h1 class="title">Historial</h1><div class="muted">Todo el año de un vistazo</div><div class="switch"><button id="py">‹</button><b>${histYear}</b><button id="ny">›</button></div><div class="card list">${rows}</div><div class="small muted">* Los checks anteriores corresponden a renta; los servicios se registran por separado.</div>`;document.getElementById('py').onclick=()=>{histYear--;history()};document.getElementById('ny').onclick=()=>{histYear++;history()}}
function contract(){let s=state.settings;document.getElementById('contract').innerHTML=`<h1 class="title">Contrato</h1><div class="muted" style="margin-bottom:14px">Información clave del arrendamiento</div><div class="card"><div class="row"><div><b>Contrato de arrendamiento</b><div class="small muted">${fmt(s.contractStart)} — ${fmt(s.contractEnd)}</div></div><span class="badge ok">Activo</span></div></div><div class="card"><div class="kv"><span class="muted">Inquilino</span><b>${esc(s.tenantName||'—')}</b></div><div class="kv"><span class="muted">Email</span><b>${esc(s.tenantEmail||'—')}</b></div><div class="kv"><span class="muted">Teléfono</span><b>${esc(s.tenantPhone||'—')}</b></div><div class="kv"><span class="muted">Renta mensual</span><b>${s.rentAmount?money(s.rentAmount):'Sin configurar'}</b></div></div><div class="card"><div class="kv"><span class="muted">Depósito</span><b>${s.depositAmount?money(s.depositAmount):'Sin configurar'} · ${s.depositPaid?'Pagado':'Pendiente'}</b></div><div class="kv"><span class="muted">Cuota administrativa</span><b>${s.adminFeeAmount?money(s.adminFeeAmount):'Sin configurar'} · ${s.adminFeePaid?'Pagada':'Pendiente'}</b></div><div class="small muted">${esc(s.adminFeeNote||'')}</div></div><button id="cedit" class="btn primary full">Editar contrato</button><button id="cdoc" class="btn secondary full" style="margin-top:8px">Ver documentos</button>`;document.getElementById('cedit').onclick=contractModal;document.getElementById('cdoc').onclick=()=>{docFilter='contract';navigate('documents')}}
function contractModal(){let s=state.settings;modal('Datos del contrato',`<form id="cf"><div class="field"><label>Inquilino</label><input id="tn" class="input" value="${esc(s.tenantName)}"></div><div class="grid"><div class="field"><label>Email</label><input id="te" class="input" type="email" value="${esc(s.tenantEmail)}"></div><div class="field"><label>Teléfono</label><input id="tp" class="input" value="${esc(s.tenantPhone)}"></div></div><div class="grid"><div class="field"><label>Inicio</label><input id="cs" class="input" type="date" value="${s.contractStart}"></div><div class="field"><label>Fin</label><input id="ce" class="input" type="date" value="${s.contractEnd}"></div></div><div class="grid"><div class="field"><label>Depósito MXN</label><input id="da" class="input" type="number" value="${s.depositAmount||''}"></div><div class="field"><label>Fecha depósito</label><input id="dd" class="input" type="date" value="${s.depositDate}"></div></div><label><input id="dp" type="checkbox" ${s.depositPaid?'checked':''}> Depósito pagado</label><div class="grid" style="margin-top:12px"><div class="field"><label>Cuota admin MXN</label><input id="aa" class="input" type="number" value="${s.adminFeeAmount||''}"></div><div class="field"><label>Fecha pagada</label><input id="ad" class="input" type="date" value="${s.adminFeeDate}"></div></div><div class="field"><label>Nota</label><input id="an" class="input" value="${esc(s.adminFeeNote)}"></div><label><input id="ap" type="checkbox" ${s.adminFeePaid?'checked':''}> Cuota pagada</label><button class="btn primary full" style="margin-top:14px">Guardar</button></form>`);document.getElementById('cf').onsubmit=e=>{e.preventDefault();Object.assign(s,{tenantName:tn.value,tenantEmail:te.value,tenantPhone:tp.value,contractStart:cs.value,contractEnd:ce.value,depositAmount:Number(da.value||0),depositDate:dd.value,depositPaid:dp.checked,adminFeeAmount:Number(aa.value||0),adminFeeDate:ad.value,adminFeeNote:an.value,adminFeePaid:ap.checked});save();closeModal();contract();toast('Contrato actualizado')}}
function db(){return new Promise((res,rej)=>{let r=indexedDB.open('rent-docs',1);r.onupgradeneeded=()=>r.result.createObjectStore('docs',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function docsAll(){let d=await db();return new Promise((res,rej)=>{let r=d.transaction('docs').objectStore('docs').getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}async function docPut(o){let d=await db();return new Promise((res,rej)=>{let t=d.transaction('docs','readwrite');t.objectStore('docs').put(o);t.oncomplete=res;t.onerror=()=>rej(t.error)})}async function docDel(id){let d=await db();return new Promise((res,rej)=>{let t=d.transaction('docs','readwrite');t.objectStore('docs').delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function documents(){let all=await docsAll(),shown=docFilter==='all'?all:all.filter(d=>d.cat===docFilter);document.getElementById('documents').innerHTML=`<h1 class="title">Documentos</h1><div class="muted" style="margin-bottom:14px">Contrato, comprobantes e identificaciones</div><button id="up" class="upload"><b>＋ Subir documento</b><div class="small muted">PDF, JPG o PNG</div></button><div class="tabs"><button class="tab ${docFilter==='all'?'active':''}" data-f="all">Todos</button>${Object.entries(CATS).map(([k,v])=>`<button class="tab ${docFilter===k?'active':''}" data-f="${k}">${v}</button>`).join('')}</div><div class="card">${shown.length?shown.map(d=>`<div class="doc"><div class="ico">${d.type.includes('pdf')?'PDF':'IMG'}</div><div data-open="${d.id}" style="cursor:pointer"><b>${esc(d.title)}</b><div class="small muted">${CATS[d.cat]} · ${Math.round(d.size/1024)} KB</div></div><button class="close" data-del="${d.id}">×</button></div>`).join(''):'<div class="muted" style="text-align:center;padding:20px">Sin documentos</div>'}</div>`;document.getElementById('up').onclick=docModal;document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{docFilter=b.dataset.f;documents()});document.querySelectorAll('[data-open]').forEach(x=>x.onclick=()=>{let d=all.find(a=>a.id===x.dataset.open);window.open(d.data,'_blank')});document.querySelectorAll('[data-del]').forEach(x=>x.onclick=async()=>{await docDel(x.dataset.del);documents();toast('Documento eliminado')})}
function docModal(){modal('Subir documento',`<form id="df"><div class="field"><label>Archivo</label><input id="file" class="input" type="file" accept="application/pdf,image/*" required></div><div class="field"><label>Título</label><input id="dt" class="input" placeholder="Ej. Contrato firmado"></div><div class="field"><label>Categoría</label><select id="dc" class="input">${Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${k===docFilter?'selected':''}>${v}</option>`).join('')}</select></div><button class="btn primary full">Guardar</button></form>`);document.getElementById('df').onsubmit=e=>{e.preventDefault();let f=file.files[0],r=new FileReader();r.onload=async()=>{await docPut({id:crypto.randomUUID(),title:dt.value||f.name,cat:dc.value,name:f.name,type:f.type,size:f.size,data:r.result});closeModal();documents();toast('Documento guardado')};r.readAsDataURL(f)}}
function more(){let s=state.settings;document.getElementById('more').innerHTML=`<h1 class="title">Más</h1><div class="muted" style="margin-bottom:14px">Configuración y respaldo</div><div class="card"><div class="kv"><span>Propiedad</span><b>${esc(s.propertyName)}</b></div><div class="kv"><span>Renta</span><b>${s.rentAmount?money(s.rentAmount):'Sin configurar'}</b></div><div class="kv"><span>Mantto</span><b>${money(s.maintenanceAmount)}</b></div><div class="kv"><span>Casa Club</span><b>${money(s.clubAmount)}</b></div><button id="set" class="btn primary full" style="margin-top:12px">Editar configuración</button></div><div class="card"><b>Respaldo</b><p class="small muted">Exporta pagos, configuración y documentos antes de cambiar de teléfono.</p><button id="exp" class="btn secondary full">Exportar respaldo</button><label class="btn secondary full" style="display:block;text-align:center;margin-top:8px">Importar respaldo<input id="imp" type="file" accept="application/json" hidden></label></div><div class="card about"><img src="assets/logo.svg" alt="RenT"><div class="small muted">RenT v1.0 · datos guardados localmente</div></div>`;document.getElementById('set').onclick=settingsModal;document.getElementById('exp').onclick=exportBackup;document.getElementById('imp').onchange=importBackup}
function settingsModal(){let s=state.settings;modal('Configuración',`<form id="sf"><div class="field"><label>Propiedad</label><input id="sp" class="input" value="${esc(s.propertyName)}"></div><div class="field"><label>Ubicación</label><input id="sl" class="input" value="${esc(s.propertyLocation)}"></div><div class="grid"><div class="field"><label>Renta mensual MXN</label><input id="sr" class="input" type="number" value="${s.rentAmount||''}"></div><div class="field"><label>Día vencimiento renta</label><input id="srd" class="input" type="number" min="1" max="28" value="${s.rentDueDay}"></div></div><div class="grid"><div class="field"><label>Mantto mensual</label><input id="sm" class="input" type="number" value="${s.maintenanceAmount}"></div><div class="field"><label>Casa Club mensual</label><input id="sc" class="input" type="number" value="${s.clubAmount}"></div></div><div class="field"><label>Día vencimiento servicios</label><input id="ssd" class="input" type="number" min="1" max="28" value="${s.serviceDueDay}"></div><button class="btn primary full">Guardar</button></form>`);document.getElementById('sf').onsubmit=e=>{e.preventDefault();Object.assign(s,{propertyName:sp.value,propertyLocation:sl.value,rentAmount:Number(sr.value||0),rentDueDay:Number(srd.value||5),maintenanceAmount:Number(sm.value||0),clubAmount:Number(sc.value||0),serviceDueDay:Number(ssd.value||5)});save();closeModal();more();toast('Configuración guardada')}}
async function exportBackup(){let docs=await docsAll(),blob=new Blob([JSON.stringify({app:'RenT',state,docs})],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='RenT-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importBackup(e){let f=e.target.files[0];if(!f)return;try{let p=JSON.parse(await f.text());if(p.app!=='RenT')throw Error('Archivo inválido');state=p.state;save();for(let d of p.docs||[])await docPut(d);more();toast('Respaldo importado')}catch(x){alert(x.message)}e.target.value=''}
document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>navigate(n.dataset.view));window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;install.style.display='block'});install.onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;install.style.display='none'}};if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));home();
</script>
</body>
</html>
